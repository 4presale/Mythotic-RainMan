services:
  web:
    build:
      context: .
      dockerfile: demo/Dockerfile
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: ["python", "demo/app.py"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
